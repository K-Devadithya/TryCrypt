<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ info.title }} // TRCRYPT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="workspace-header">
            <div>
                <a href="/" class="back-link">← BACK TO DASHBOARD</a>
                <h1>{{ info.title|upper }}<span>_</span></h1>
                <p>{{ info.description }}</p>
            </div>
        </header>

        <input type="hidden" id="activeCipher" value="{{ cipher_id }}">

        <div class="grid-layout">
            <!-- Input & Configuration Panel -->
            <div class="card">
                <h2>// WORKSPACE CONFIGURATION</h2>

                <label for="messageInput">INPUT TEXT</label>
                <textarea id="messageInput" rows="5" placeholder="Enter plaintext or ciphertext..."></textarea>

                <div id="keyGroup">
                    <label for="keyInput">SECRET KEY / PARAMETER</label>
                    <input type="text" id="keyInput" placeholder="Enter key...">
                </div>

                <div class="button-group">
                    <button class="btn btn-encrypt" onclick="processCipher('encrypt')">ENCRYPT</button>
                    <button class="btn btn-decrypt" onclick="processCipher('decrypt')">DECRYPT</button>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="card">
                <h2>// OUTPUT PANEL</h2>

                <label>PROCESSED RESULT</label>
                <div class="output-container">
                    <button class="copy-btn" onclick="copyToClipboard('resultBox')">COPY</button>
                    <div id="resultBox" class="output-display">Awaiting input...</div>
                </div>

                <div id="keyUsedGroup" class="hidden">
                    <label>KEY GENERATED / USED</label>
                    <div class="output-container">
                        <button class="copy-btn" onclick="copyToClipboard('keyUsedBox')">COPY</button>
                        <div id="keyUsedBox" class="output-display key-display">---</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
